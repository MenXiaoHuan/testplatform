# === Spring Boot 应用配置 ===
spring:
  # === 应用名称 ===
  application:
    name: playwright-platform-server

  # === 数据源配置（MySQL 数据库） ===
  datasource:
    url: ${PLATFORM_DB_URL}
    username: ${PLATFORM_DB_USERNAME}
    password: ${PLATFORM_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # === Redis 缓存配置 ===
  data:
    redis:
      host: ${PLATFORM_REDIS_HOST}
      port: ${PLATFORM_REDIS_PORT:6379}
      password: ${PLATFORM_REDIS_PASSWORD}
      timeout: ${PLATFORM_REDIS_TIMEOUT:2s}

  # === Flyway 数据库迁移配置 ===
  flyway:
    enabled: true

  # === AI 模型配置（DeepSeek） ===
  ai:
    deepseek:
      api-key: ${PLATFORM_DEEPSEEK_API_KEY:}
      base-url: ${PLATFORM_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${PLATFORM_DEEPSEEK_MODEL:deepseek-chat}
          temperature: ${PLATFORM_DEEPSEEK_TEMPERATURE:0.7}

# === MyBatis 配置 ===
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# === 日志配置 ===
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%thread] [requestId=%X{requestId:-}, traceId=%X{traceId:-}, taskId=%X{taskId:-}, sceneId=%X{sceneId:-}, repoId=%X{repoId:-}, stage=%X{stage:-}] %logger{36} - %msg%n"

# === 服务器配置 ===
server:
  port: ${SERVER_PORT:8080}
  # === Tomcat 线程池配置 ===
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

# === 平台自定义配置 ===
platform:
  # === 仓库凭据加密密钥（32 字节 base64） ===
  security:
    credential-key: ${PLATFORM_CREDENTIAL_KEY:}

  # === 认证与注册配置 ===
  auth:
    cookie-name: ${PLATFORM_AUTH_COOKIE_NAME:platform_session}
    sliding-days: ${PLATFORM_AUTH_SLIDING_DAYS:14}
    # 默认关闭自助注册；个人部署临时打开注册后再关掉。
    registration-enabled: ${PLATFORM_REGISTRATION_ENABLED:false}

  # === 任务执行服务配置 ===
  task:
    execution:
      core-pool-size: ${PLATFORM_TASK_CORE_POOL_SIZE:2}
      max-pool-size: ${PLATFORM_TASK_MAX_POOL_SIZE:4}
      queue-capacity: ${PLATFORM_TASK_QUEUE_CAPACITY:50}
      keep-alive-seconds: ${PLATFORM_TASK_KEEP_ALIVE_SECONDS:60}
      install-timeout-seconds: ${PLATFORM_TASK_INSTALL_TIMEOUT_SECONDS:600}
      test-timeout-seconds: ${PLATFORM_TASK_TEST_TIMEOUT_SECONDS:1800}
      monitor-log-interval-seconds: ${PLATFORM_TASK_MONITOR_LOG_INTERVAL_SECONDS:30}
      # 单个产物文件 100MB，单任务产物总量 1GB。
      max-artifact-file-bytes: ${PLATFORM_TASK_MAX_ARTIFACT_FILE_BYTES:104857600}
      max-artifact-total-bytes: ${PLATFORM_TASK_MAX_ARTIFACT_TOTAL_BYTES:1073741824}
    # 默认 0 = 不自动清理；生产环境可按需设为 90 天。
    retention:
      days: ${PLATFORM_TASK_RETENTION_DAYS:0}
      cron: ${PLATFORM_TASK_RETENTION_CRON:0 30 3 * * *}

  # === 测试运行器配置（仅 Docker Runner） ===
  runner:
    workspace-root: ${PLATFORM_RUNNER_WORKSPACE_ROOT:${java.io.tmpdir}/playwright-platform/workspaces}
    host-workspace-root: ${PLATFORM_RUNNER_HOST_WORKSPACE_ROOT:${platform.runner.workspace-root}}
    git-clone-timeout-seconds: ${PLATFORM_RUNNER_GIT_CLONE_TIMEOUT_SECONDS:120}
    max-log-bytes: ${PLATFORM_RUNNER_MAX_LOG_BYTES:52428800}
    max-test-log-bytes: ${PLATFORM_RUNNER_MAX_TEST_LOG_BYTES:209715200}
    # 私有仓库凭据在仓库管理中按仓库配置；这里只保留 SSH host key 校验等全局设置。
    known-hosts-path: ${PLATFORM_GIT_KNOWN_HOSTS_PATH:}
    submodules-enabled: ${PLATFORM_GIT_SUBMODULES_ENABLED:false}
    lfs-enabled: ${PLATFORM_GIT_LFS_ENABLED:false}
    # === Docker 容器运行器配置 ===
    docker:
      image: ${PLATFORM_RUNNER_DOCKER_IMAGE:mcr.microsoft.com/playwright:v1.61.1-noble}
      network: ${PLATFORM_RUNNER_DOCKER_NETWORK:bridge}
      memory: ${PLATFORM_RUNNER_DOCKER_MEMORY:2g}
      cpus: ${PLATFORM_RUNNER_DOCKER_CPUS:2}
      container-workspace-root: ${PLATFORM_RUNNER_DOCKER_CONTAINER_WORKSPACE_ROOT:/workspace/task}
      remove-container: ${PLATFORM_RUNNER_DOCKER_REMOVE_CONTAINER:true}
      image-pull-timeout-seconds: ${PLATFORM_RUNNER_DOCKER_IMAGE_PULL_TIMEOUT_SECONDS:1800}

  # === 对象存储配置（MinIO） ===
  storage:
    bucket: ${PLATFORM_STORAGE_BUCKET:qa-report}
    minio:
      endpoint: ${PLATFORM_MINIO_ENDPOINT:http://localhost:9000}
      public-endpoint: ${PLATFORM_MINIO_PUBLIC_ENDPOINT:${PLATFORM_MINIO_ENDPOINT:http://localhost:9000}}
      region: ${PLATFORM_MINIO_REGION:us-east-1}
      access-key: ${PLATFORM_MINIO_ACCESS_KEY}
      secret-key: ${PLATFORM_MINIO_SECRET_KEY}

  # === AI 智能体配置 ===
  ai:
    system-prompt-path: ${PLATFORM_AI_SYSTEM_PROMPT_PATH:classpath:AGENT.md}
    # === AI 上下文管理配置 ===
    context:
      max-tokens: ${PLATFORM_AI_CONTEXT_MAX_TOKENS:8000}
      max-messages: ${PLATFORM_AI_CONTEXT_MAX_MESSAGES:50}
      compression-threshold: ${PLATFORM_AI_CONTEXT_COMPRESSION_THRESHOLD:0.8}
      keep-recent-messages: ${PLATFORM_AI_CONTEXT_KEEP_RECENT:3}
      max-message-content-length: ${PLATFORM_AI_CONTEXT_MAX_MSG_LENGTH:4000}
      use-llm-summary: ${PLATFORM_AI_CONTEXT_USE_LLM_SUMMARY:true}
    # === AI 调用配置 ===
    call:
      timeout-seconds: ${PLATFORM_AI_CALL_TIMEOUT:60}
      max-retries: ${PLATFORM_AI_CALL_MAX_RETRIES:2}
      retry-delay-ms: ${PLATFORM_AI_CALL_RETRY_DELAY:1000}
    # === AI 用量保护：每日次数 + 全局并发 ===
    quota:
      daily-limit: ${PLATFORM_AI_DAILY_LIMIT:50}
      max-concurrent: ${PLATFORM_AI_MAX_CONCURRENT:4}
    # === AI 输入清理配置 ===
    sanitizer:
      enabled: ${PLATFORM_AI_SANITIZER_ENABLED:true}
      max-length: ${PLATFORM_AI_SANITIZER_MAX_LENGTH:10000}

  # === 缓存配置 ===
  cache:
    detail-ttl: ${PLATFORM_CACHE_DETAIL_TTL:5m}
    null-ttl: ${PLATFORM_CACHE_NULL_TTL:1m}
    jitter-seconds: ${PLATFORM_CACHE_JITTER_SECONDS:60}
    mutex-ttl: ${PLATFORM_CACHE_MUTEX_TTL:5s}
    lock-retry-times: ${PLATFORM_CACHE_LOCK_RETRY_TIMES:3}
    lock-wait-millis: ${PLATFORM_CACHE_LOCK_WAIT_MILLIS:50}