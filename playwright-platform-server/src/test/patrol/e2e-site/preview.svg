<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="图片预览示例">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.92" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" />
  <circle cx="120" cy="90" r="70" fill="#38bdf8" fill-opacity="0.35" />
  <circle cx="720" cy="420" r="110" fill="#1d4ed8" fill-opacity="0.35" />
  <rect x="110" y="110" width="580" height="280" rx="18" fill="url(#card)" />
  <text x="400" y="228" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#0f172a">图片预览</text>
  <text x="400" y="278" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#475569">用于验证 Lightbox 图片放大查看</text>
  <rect x="300" y="312" width="200" height="44" rx="22" fill="#2563eb" />
  <text x="400" y="340" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#ffffff">800 × 500</text>
</svg>
