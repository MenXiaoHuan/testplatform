x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}@langfuse-postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD in .env}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${PLATFORM_MINIO_ACCESS_KEY:?Set PLATFORM_MINIO_ACCESS_KEY in .env}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${PLATFORM_MINIO_SECRET_KEY:?Set PLATFORM_MINIO_SECRET_KEY in .env}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${PLATFORM_MINIO_ACCESS_KEY:?Set PLATFORM_MINIO_ACCESS_KEY in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${PLATFORM_MINIO_SECRET_KEY:?Set PLATFORM_MINIO_SECRET_KEY in .env}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      MYSQL_DATABASE: ${PLATFORM_DB_NAME:?Set PLATFORM_DB_NAME in .env}
    ports:
      - "${PLATFORM_MYSQL_HOST_PORT:?Set PLATFORM_MYSQL_HOST_PORT in .env}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PLATFORM_MINIO_ACCESS_KEY:?Set PLATFORM_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${PLATFORM_MINIO_SECRET_KEY:?Set PLATFORM_MINIO_SECRET_KEY in .env}
    ports:
      - "${PLATFORM_MINIO_API_HOST_PORT:?Set PLATFORM_MINIO_API_HOST_PORT in .env}:9000"
      - "${PLATFORM_MINIO_CONSOLE_HOST_PORT:?Set PLATFORM_MINIO_CONSOLE_HOST_PORT in .env}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    command: >
      sh -c 'redis-server --appendonly yes --requirepass "$$PLATFORM_REDIS_PASSWORD"'
    environment:
      PLATFORM_REDIS_PASSWORD: ${PLATFORM_REDIS_PASSWORD:?Set PLATFORM_REDIS_PASSWORD in .env}
    ports:
      - "${PLATFORM_REDIS_HOST_PORT:?Set PLATFORM_REDIS_HOST_PORT in .env}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${PLATFORM_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ================= Langfuse（自建观测后端） =================
  langfuse-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?Set LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  langfuse-redis:
    image: redis:7-alpine
    command: >
      sh -c 'redis-server --requirepass "$$LANGFUSE_REDIS_PASSWORD"'
    environment:
      LANGFUSE_REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?Set LANGFUSE_REDIS_PASSWORD in .env}
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${LANGFUSE_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 复用现有 MinIO；bucket 需提前创建（见 README/部署命令：mc mb 或 S3 CreateBucket）
  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      LANGFUSE_INIT_ORG_ID: platform
      LANGFUSE_INIT_ORG_NAME: Platform
      LANGFUSE_INIT_PROJECT_ID: platform-eval
      LANGFUSE_INIT_PROJECT_NAME: Platform Eval
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Set LANGFUSE_PUBLIC_KEY in .env}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Set LANGFUSE_SECRET_KEY in .env}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?Set LANGFUSE_INIT_USER_EMAIL in .env}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?Set LANGFUSE_INIT_USER_PASSWORD in .env}
    ports:
      - "${LANGFUSE_HOST_PORT:-3000}:3000"

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
    environment:
      <<: *langfuse-env

  server:
    build:
      context: ./playwright-platform-server
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 把 .env 中新增的池/超时/配额/注册等配置全部注入 server；
    # 下面的 environment 仍会覆盖同名项，敏感值和必填校验保持不变。
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PLATFORM_REGISTRATION_ENABLED: ${PLATFORM_REGISTRATION_ENABLED:-false}
      PLATFORM_DB_URL: ${PLATFORM_DB_URL:?Set PLATFORM_DB_URL in .env}
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME:?Set PLATFORM_DB_USERNAME in .env}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?Set PLATFORM_DB_PASSWORD in .env}
      PLATFORM_REDIS_HOST: ${PLATFORM_REDIS_HOST:?Set PLATFORM_REDIS_HOST in .env}
      PLATFORM_REDIS_PORT: ${PLATFORM_REDIS_PORT:-6379}
      PLATFORM_REDIS_PASSWORD: ${PLATFORM_REDIS_PASSWORD:?Set PLATFORM_REDIS_PASSWORD in .env}
      PLATFORM_MINIO_ENDPOINT: ${PLATFORM_MINIO_ENDPOINT:?Set PLATFORM_MINIO_ENDPOINT in .env}
      PLATFORM_MINIO_PUBLIC_ENDPOINT: ${PLATFORM_MINIO_PUBLIC_ENDPOINT:?Set PLATFORM_MINIO_PUBLIC_ENDPOINT in .env}
      PLATFORM_MINIO_ACCESS_KEY: ${PLATFORM_MINIO_ACCESS_KEY:?Set PLATFORM_MINIO_ACCESS_KEY in .env}
      PLATFORM_MINIO_SECRET_KEY: ${PLATFORM_MINIO_SECRET_KEY:?Set PLATFORM_MINIO_SECRET_KEY in .env}
      PLATFORM_STORAGE_BUCKET: ${PLATFORM_STORAGE_BUCKET:?Set PLATFORM_STORAGE_BUCKET in .env}
      PLATFORM_RUNNER_WORKSPACE_ROOT: ${PLATFORM_RUNNER_WORKSPACE_ROOT:?Set PLATFORM_RUNNER_WORKSPACE_ROOT in .env}
      PLATFORM_RUNNER_HOST_WORKSPACE_ROOT: ${PLATFORM_RUNNER_HOST_WORKSPACE_ROOT:?Set PLATFORM_RUNNER_HOST_WORKSPACE_ROOT in .env}
      PLATFORM_RUNNER_DOCKER_IMAGE: ${PLATFORM_RUNNER_DOCKER_IMAGE:?Set PLATFORM_RUNNER_DOCKER_IMAGE in .env}
      PLATFORM_RUNNER_DOCKER_NETWORK: ${PLATFORM_RUNNER_DOCKER_NETWORK:?Set PLATFORM_RUNNER_DOCKER_NETWORK in .env}
      PLATFORM_RUNNER_DOCKER_MEMORY: ${PLATFORM_RUNNER_DOCKER_MEMORY:?Set PLATFORM_RUNNER_DOCKER_MEMORY in .env}
      PLATFORM_RUNNER_DOCKER_CPUS: ${PLATFORM_RUNNER_DOCKER_CPUS:?Set PLATFORM_RUNNER_DOCKER_CPUS in .env}
      PLATFORM_RUNNER_DOCKER_CONTAINER_WORKSPACE_ROOT: ${PLATFORM_RUNNER_DOCKER_CONTAINER_WORKSPACE_ROOT:?Set PLATFORM_RUNNER_DOCKER_CONTAINER_WORKSPACE_ROOT in .env}
      PLATFORM_DEEPSEEK_API_KEY: ${PLATFORM_DEEPSEEK_API_KEY:-}
      PLATFORM_DEEPSEEK_BASE_URL: ${PLATFORM_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      PLATFORM_DEEPSEEK_MODEL: ${PLATFORM_DEEPSEEK_MODEL:-deepseek-chat}
      PLATFORM_DEEPSEEK_TEMPERATURE: ${PLATFORM_DEEPSEEK_TEMPERATURE:-0.7}
      PLATFORM_PATROL_MAX_CONCURRENT: ${PLATFORM_PATROL_MAX_CONCURRENT:-2}
      PLATFORM_PATROL_RETENTION_DAYS: ${PLATFORM_PATROL_RETENTION_DAYS:-90}
      PLATFORM_PATROL_RETENTION_CRON: ${PLATFORM_PATROL_RETENTION_CRON:-0 30 2 * * *}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_READ_KEY_ENABLED: ${LANGFUSE_READ_KEY_ENABLED:-false}
    ports:
      - "${PLATFORM_SERVER_HOST_PORT:?Set PLATFORM_SERVER_HOST_PORT in .env}:8080"
    volumes:
      - ./playwright-platform-server:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PLATFORM_RUNNER_HOST_WORKSPACE_ROOT:?Set PLATFORM_RUNNER_HOST_WORKSPACE_ROOT in .env}:${PLATFORM_RUNNER_WORKSPACE_ROOT:?Set PLATFORM_RUNNER_WORKSPACE_ROOT in .env}
      - maven-cache:/root/.m2

  web:
    build:
      context: ./playwright-platform-web
      dockerfile: Dockerfile.dev
    depends_on:
      - server
    environment:
      VITE_API_PROXY_TARGET: ${PLATFORM_WEB_API_PROXY_TARGET:?Set PLATFORM_WEB_API_PROXY_TARGET in .env}
    ports:
      - "${PLATFORM_WEB_HOST_PORT:?Set PLATFORM_WEB_HOST_PORT in .env}:5173"
    volumes:
      - ./playwright-platform-web:/workspace
      - web-node-modules:/workspace/node_modules

volumes:
  mysql-data:
  minio-data:
  redis-data:
  maven-cache:
  web-node-modules:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-redis-data:
